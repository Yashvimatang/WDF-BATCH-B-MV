<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password| CHARUSAT</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            background-color: #6b96bd;
            color: #333;
            text-align: center;
        }
        .other-page {
    background-image: url("commonbackground.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
        }
        .login-box {
            background-color:  #6b96bd;
            width: 400px;
            padding: 30px;
            margin: 80px auto;
            border-radius: 10px;
        }
        h2 {
            color: #3f607d;
        }
        p {
            font-size: 16px;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 25px;
            padding: 12px 30px;
            background-color:  #3f607d;
            color: white;
            border: none;
        }
    </style>
</head>
<body class="other-page">
    <div class="login-box">
        <h2>Forgot Password</h2>
        <p>Enter your email address to reset your password.</p>
        <form action="resetpassword.html" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Reset Password</button>
        </form>
    </div>
</body>
</html>
